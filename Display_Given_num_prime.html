<html>
<body>
<script type="text/javascript">
function prime()
{
var num=document.getElementById("number").value;
count = 0
for(i=1;i<=num;i++)
{
if(num % i ==0)
{
count=count+1;
}
}
if(count==2)
{
error1.textContent ="prime number";
error1.style.color = "red"
}
else
{
error1.textContent =" Not prime number";
error1.style.color = "blue"
}
}
</script>
<label for="number">enter num:</label>
<input type="number" id="number" name="name">
<br><br>
<input type="submit"value="submit" onClick="prime()">
<br><br>
<span id="error1"></span>
</body>
</html>
